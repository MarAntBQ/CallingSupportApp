services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: callingsupportapp
      POSTGRES_PASSWORD: callingsupportapp
      POSTGRES_DB: callingsupportapp
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callingsupportapp -d callingsupportapp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
