services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: callingsupportapp
      POSTGRES_PASSWORD: callingsupportapp
      POSTGRES_DB: callingsupportapp
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callingsupportapp -d callingsupportapp']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
