name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # Fuera de un PR (push a main, schedule) siempre corre el CI completo.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git diff LOCAL entre los commits DEL EVENTO (base.sha / head.sha), que quedan fijos en
          # el payload aun al re-ejecutar un run viejo. Local y sin el tope de 300 archivos del
          # compare API, así un PR grande no se cuela con cambios de código fuera de las skills.
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags --quiet origin "$base" "$head" 2>/dev/null || true
          files="$(git diff --name-only "$base" "$head")"
          echo "Archivos cambiados:"
          printf '%s\n' "$files"
          # code=true si hay CUALQUIER archivo fuera de .claude/skills/ (es decir, hay cambios de
          # código). Solo cuando el PR toca EXCLUSIVAMENTE skills se saltan ci/e2e (son .md que
          # vienen sincronizados y ya revisados en ClaudeSkills). Un job skippeado por `if:` cuenta
          # como check requerido APROBADO; `paths-ignore` a nivel workflow lo dejaría colgado.
          if printf '%s\n' "$files" | grep -qvE '^\.claude/skills/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: callingsupportapp
          POSTGRES_PASSWORD: callingsupportapp
          POSTGRES_DB: callingsupportapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callingsupportapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/callingsupportapp
      DIRECT_DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/callingsupportapp
      TEST_DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/csa_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - name: Pruebas del bot /tomar, de los perfiles del equipo y del título del PR
        run: node --test ".github/scripts/*.test.cjs"
      - name: Migraciones sobre la base vacía
        run: npm run db:migrate
      - name: Base de pruebas de integración
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE csa_test'
      - run: npm run test
      - run: npm run build

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: callingsupportapp
          POSTGRES_PASSWORD: callingsupportapp
          POSTGRES_DB: callingsupportapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callingsupportapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/callingsupportapp_e2e
      DIRECT_DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/callingsupportapp_e2e
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Navegador de Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Llave de cifrado efímera (la verificación en dos pasos cifra su secreto)
        run: echo "ENC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migraciones sobre la base vacía
        run: npm run db:migrate
      - run: npm run build
      - name: Pruebas de punta a punta
        run: npm run test:e2e
      - name: Trace de Playwright si falla (datos inventados)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
