name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: callingsupportapp
          POSTGRES_PASSWORD: callingsupportapp
          POSTGRES_DB: callingsupportapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callingsupportapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/callingsupportapp
      DIRECT_DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/callingsupportapp
      TEST_DATABASE_URL: postgres://callingsupportapp:callingsupportapp@localhost:5432/csa_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - name: Migraciones sobre la base vacía
        run: npm run db:migrate
      - name: Base de pruebas de integración
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE csa_test'
      - run: npm run test
      - run: npm run build
