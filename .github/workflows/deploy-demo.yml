name: Desplegar demo (demo.callingsupportapp.org)

# La demo publica SOLO versiones etiquetadas vX.Y.Z (lo ya probado en staging).
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a desplegar (vX.Y.Z)'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El tag debe apuntar a un commit de main
        env:
          REF: ${{ github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$REF" origin/main; then
            echo "::error::$REF no apunta a un commit de main; no se despliega a demo."
            exit 1
          fi
      - name: Desplegar por SSH (como el usuario cliente callingsupportapp)
        env:
          SSH_KEY: ${{ secrets.VPS_DEMO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REF: ${{ github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p 22593 callingsupportapp@162.35.180.32 "deploy-demo $REF"
