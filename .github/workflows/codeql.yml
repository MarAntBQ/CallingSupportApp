name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # Fuera de un PR (push a main, schedule) siempre corre el análisis completo.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git diff LOCAL entre los commits DEL EVENTO (base.sha / head.sha), fijos en el payload
          # aun al re-ejecutar. Sin el tope de 300 archivos del compare API, así un PR grande no se
          # cuela con cambios de código fuera de las skills.
          # `base...head` (tres puntos) = solo los cambios PROPIOS del PR, no lo que main avanzó.
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags --quiet origin "$base" "$head" 2>/dev/null || true
          files="$(git diff --name-only "$base...$head")"
          echo "Archivos cambiados:"
          printf '%s\n' "$files"
          # code=true si hay CUALQUIER archivo fuera de .claude/skills/. Solo cuando el PR toca
          # EXCLUSIVAMENTE skills se salta CodeQL (un job skippeado por `if:` cuenta como aprobado).
          if printf '%s\n' "$files" | grep -qvE '^\.claude/skills/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
