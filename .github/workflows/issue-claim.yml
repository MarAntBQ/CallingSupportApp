name: Tomar o soltar un issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-claims
  cancel-in-progress: false

jobs:
  claim:
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const l = require('./.github/scripts/claim-logic.cjs');
            const actor = context.payload.comment.user.login;
            const command = l.parseCommand(context.payload.comment.body);
            if (!command) return;

            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
            const labels = issue.labels.map((x) => x.name);
            const assignees = issue.assignees.map((x) => x.login);
            const free = `https://github.com/${owner}/${repo}/issues?q=is%3Aopen+is%3Aissue+no%3Aassignee+-label%3Abloqueado+-label%3A%22necesita-dise%C3%B1o%22`;
            const removeInProgress = async () => {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: l.IN_PROGRESS });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            };
            const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            const fecha = (d) => new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });

            if (command === 'take') {
              const mine = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', assignee: actor, labels: l.IN_PROGRESS, per_page: 100,
              });
              const actorOpenClaims = mine.filter((i) => !i.pull_request && i.number !== number).map((i) => i.number);
              const d = l.decideTake({ issueState: issue.state, labels, assignees, actor, actorOpenClaims });

              if (!d.ok) {
                const msg = {
                  closed: 'Este issue está cerrado.',
                  blocked: `Este issue todavía está bloqueado por sus dependencias (mira la sección *Dependencias*). Elige otro de los que no tienen la etiqueta \`bloqueado\`: ${free}`,
                  'needs-design': 'Este issue todavía necesita diseño; no se puede tomar.',
                  taken: `Este issue ya lo tiene @${d.by}. Elige otro libre: ${free}`,
                  'already-yours': `@${actor}, este issue ya es tuyo.`,
                  'has-other': `@${actor}, ya tienes #${d.other} en curso. Termínalo o suéltalo con \`/soltar\` antes de tomar otro.`,
                }[d.reason];
                await reply(msg);
                return;
              }

              await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [actor] });
              const after = await github.rest.issues.get({ owner, repo, issue_number: number });
              if (!after.data.assignees.some((a) => a.login === actor)) {
                await reply(`@${actor}, no pude asignarte el issue automáticamente, así que **no quedó tomado**. Vuelve a comentar \`/tomar\` en unos minutos; si sigue fallando, comenta aquí para que el responsable del repositorio lo revise.`);
                return;
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [l.IN_PROGRESS] });
              await reply([
                `🚧 @${actor} tomó este issue el ${fecha(context.payload.comment.created_at)}.`,
                '',
                'Siguientes pasos:',
                `1. Crea tu rama: \`<tipo>/${number}-titulo-corto\` (\`feat\`, \`fix\`, \`docs\`, \`chore\`…).`,
                `2. Abre un PR **en borrador** con \`Refs #${number}\` dentro de las próximas 48 horas.`,
                `3. Comenta tus avances aquí. Sin actividad en ${l.REMIND_AFTER_DAYS} días te lo recordamos; a los ${l.RELEASE_AFTER_DAYS} se libera para otra persona.`,
                '4. Si no puedes seguir, comenta `/soltar`.',
                '',
                'Guía: [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) · skill `trabajar-un-issue`.',
              ].join('\n'));
              return;
            }

            const d = l.decideRelease({ assignees, actor });
            if (!d.ok) {
              await reply(d.reason === 'not-taken'
                ? 'Este issue no está tomado por nadie.'
                : `Solo @${d.by} o el responsable del repositorio pueden soltarlo.`);
              return;
            }
            await github.rest.issues.removeAssignees({ owner, repo, issue_number: number, assignees });
            await removeInProgress();
            await reply('Issue liberado: está disponible para otra persona. Para tomarlo, comenta `/tomar`.');
