name: Tarea
description: Un resultado concreto que alguien puede tomar y entregar en un solo PR.
title: ""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## Regla: el issue se autocontiene

        Quien tome este issue **no estuvo en ninguna conversación previa**. Tiene que poder
        terminarlo leyendo solo este issue y los archivos que enlaza, sin preguntar.

        - Si la información vive en un chat, una llamada o un tablero privado, **cópiala aquí**
          (sin datos de personas). Un enlace a algo que el colaborador no puede abrir no cuenta.
        - Las decisiones ya tomadas van escritas como decisiones, para que no se vuelvan a discutir.
        - Un issue = **un resultado** que cabe en un PR revisable. Si son dos cosas, son dos issues.

        Guía completa: skill `escribir-un-issue` en `.claude/skills/`.
  - type: input
    id: tarjeta
    attributes:
      label: Tarjeta de Trello
      description: Opcional. Solo si la tarea viene del tablero del autor.
      placeholder: https://trello.com/c/...
  - type: textarea
    id: resultado
    attributes:
      label: Resultado
      description: Qué cambia cuando esto esté terminado, y para quién (qué llamamiento o persona lo usa).
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto y decisiones ya tomadas
      description: Por qué se hace, y qué ya está decidido (stack, nombres, comportamiento). No se vuelve a discutir dentro del PR.
    validations:
      required: true
  - type: textarea
    id: legacy
    attributes:
      label: Referencia en la v1 (rama legacy)
      description: Si es un port, las rutas exactas en la rama `legacy` y qué funciones mirar. Se leen con `git show legacy:<ruta>`.
      placeholder: |
        - backend/src/templo/templo.service.ts → crearInscripcion()
        - frontend/src/pages/InscripcionPage.tsx
  - type: textarea
    id: alcance
    attributes:
      label: Alcance
      description: Qué entra en este issue.
    validations:
      required: true
  - type: textarea
    id: exclusiones
    attributes:
      label: Exclusiones
      description: Trabajo cercano que este issue NO incluye, para que el alcance no crezca solo.
    validations:
      required: true
  - type: textarea
    id: especificacion
    attributes:
      label: Especificación
      description: Datos (tablas, campos, tipos, reglas), pantallas, rutas o endpoints, permisos y reglas de negocio. Lo suficiente para construirlo sin adivinar.
    validations:
      required: true
  - type: textarea
    id: aceptacion
    attributes:
      label: Criterios de aceptación
      description: Observables. Si no se puede comprobar mirando algo, no es un criterio.
      placeholder: |
        - [ ] Resultado observable uno
        - [ ] Resultado observable dos
    validations:
      required: true
  - type: textarea
    id: verificacion
    attributes:
      label: Verificación
      description: Cómo se demuestra que funciona, con comandos o pasos concretos.
      placeholder: |
        - npm run typecheck && npm run build sin errores
        - Abrir /ruta, hacer X, ver Y
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependencias
      description: Issues que deben estar cerrados antes, y los que este desbloquea. "Ninguna" si no hay.
      placeholder: |
        Bloqueado por: #N
        Desbloquea: #M
    validations:
      required: true
  - type: dropdown
    id: datos
    attributes:
      label: ¿Toca datos de personas?
      description: Si recoge, guarda, muestra o exporta datos de personas, el PR debe pasar por la skill `datos-de-miembros`.
      options:
        - "No"
        - "Sí"
    validations:
      required: true
  - type: checkboxes
    id: autocontenido
    attributes:
      label: Comprobación de autocontenido
      options:
        - label: Revisé que esto no contradice el Manual General de la Iglesia.
          required: true
        - label: Se puede terminar leyendo solo este issue y los archivos que enlaza.
          required: true
        - label: No depende de información privada (chats, tableros privados, repos privados).
          required: true
        - label: No contiene datos de personas reales ni secretos.
          required: true
        - label: Cabe en un solo PR revisable.
          required: true
