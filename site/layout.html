<!doctype html>
<html lang="es" {{i18nAttrs}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="{{root}}assets/lang.js"></script>
  <title>{{page.fullTitle}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{url.self}}">
  <link rel="alternate" hreflang="x-default" href="{{url.self}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CallingSupportApp">
  <meta property="og:title" content="{{page.fullTitle}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{url.self}}">
  <meta property="og:image" content="{{site.url}}/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f6f5f4">
  <link rel="icon" href="{{root}}assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
  <link rel="manifest" href="{{root}}assets/site.webmanifest">
  <link rel="preload" href="{{root}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/styles.css">
</head>
<body>
  <a class="skip" href="#main">{{t.skip}}</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="{{root}}" {{a.brand}}>
        <img src="{{root}}assets/logo.png" alt="CallingSupportApp" width="180" height="48">
      </a>
      <nav class="nav nav--desktop" {{a.menu}}>
        <ul>
          {{nav}}
        </ul>
      </nav>
      <nav class="nav nav--mobile" {{a.menu}}>
        <details class="nav__menu">
          <summary>{{t.menu}}</summary>
          <ul>
            {{nav}}
          </ul>
        </details>
      </nav>
      <div class="langs" role="group" {{a.language}} hidden>
        <button type="button" data-set-lang="es" lang="es" aria-pressed="true">ES</button>
        <button type="button" data-set-lang="pt" lang="pt" aria-pressed="false">PT</button>
        <button type="button" data-set-lang="en" lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap page">
    {{articles}}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <ul class="footer__links">
        {{footerNav}}
      </ul>
      <p>{{t.license}} · <a href="https://github.com/MarAntBQ/CallingSupportApp">GitHub</a> · <a href="mailto:devteam@callingsupportapp.org">devteam@callingsupportapp.org</a></p>
      <p class="muted">{{t.unofficial}}</p>
    </div>
  </footer>

  <script src="{{root}}assets/live.js" defer></script>
</body>
</html>
